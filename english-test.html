<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 상식 퀴즈 결과</title>
  <style>
    :root {
      --primary-color: #00b894;
      --bg-color: #f4f9f7;
      --card-bg: #ffffff;
      --text-main: #2d3436;
      --text-sub: #636e72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* 화면 전체의 중앙에 배치하도록 설정 */
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center; /* 가로 중앙 정렬 */
      align-items: center;     /* 세로 중앙 정렬 */
      padding: 24px 16px;
    }

    /* 결과 카드 메인 컨테이너 */
    .result-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px; /* 카드 최대 폭 설정 */
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 정답 개수 안내 메인 타이틀 */
    .score-badge {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .result-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: 4px;
    }

    /* 박스 내부 해설 섹션 */
    .description-box {
      background-color: #f0fdf9;
      border: 1.5px dashed #a8e6cf;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
    }

    .hashtag-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tag {
      background-color: #e6faf4;
      color: var(--primary-color);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .description-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    .description-list li {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    /* 버튼 스타일 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: #00a383;
    }

    .btn-secondary {
      background-color: #edf2f7;
      color: #4a5568;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- 중앙 정렬되는 결과 카드 -->
  <div class="result-card">
    
    <!-- 상단 점수 및 결과 타이틀 -->
    <div>
      <div class="score-badge">12문제 중 5문제 정답!</div>
      <h1 class="result-title">아쉬운 쑥쑥이 싹 🌱</h1>
    </div>

    <!-- 상세 해설 및 해시태그 -->
    <div class="description-box">
      <div class="hashtag-group">
        <span class="tag">#발전가능성</span>
        <span class="tag">#복습필요</span>
        <span class="tag">#연습하면만점</span>
      </div>
      <ul class="description-list">
        <li>✏️ 기초적인 단어들을 잘 기억하고 계시지만 약간의 아쉬움이 남습니다.</li>
        <li>✏️ 자주 쓰이는 기본 회화와 필수 단어를 조금 더 연습해 보세요.</li>
        <li>✏️ 매일 조금씩 공부하면 금방 실력이 성장할 수 있습니다.</li>
      </ul>
    </div>

    <!-- 하단 버튼 영역 -->
    <div class="btn-group">
      <button type="button" class="btn btn-primary" onclick="copyLink()">결과 링크 복사하기</button>
      <a href="english-test.html" class="btn btn-secondary">다시 테스트하기</a>
      <a href="index.html" class="btn btn-secondary">메인으로 이동</a>
    </div>

  </div>

  <script>
    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("링크가 복사되었습니다!");
      }).catch(err => {
        alert("복사에 실패했습니다.");
      });
    }
  </script>

</body>
</html>
