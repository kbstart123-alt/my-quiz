<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 연애 캐릭터 테스트 💕 - 네트워크.gg</title>
  <style>
    :root {
      --primary: #ff6b81;
      --primary-hover: #ff4757;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #2f3542;
      --sub-text: #747d8c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* 시작 화면 */
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--sub-text);
      margin-bottom: 24px;
    }

    .main-img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background-color: var(--primary);
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-sub {
      background-color: #f1f2f6;
      color: var(--text-color);
      margin-top: 10px;
    }

    .btn-sub:hover {
      background-color: #e4e5ea;
    }

    /* 진행 바 */
    .progress-wrapper {
      width: 100%;
      background-color: #eee;
      height: 8px;
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    /* 질문 화면 */
    .q-number {
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .q-text {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 28px;
      line-height: 1.4;
      min-height: 60px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      padding: 16px;
      border: 2px solid #f1f2f6;
      border-radius: 12px;
      background: white;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background-color: #fff0f3;
    }

    /* 로딩 화면 */
    .loading-text {
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 20px;
    }

    /* 결과 화면 */
    .result-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text-color);
    }

    .result-desc {
      text-align: left;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .result-desc p {
      margin-bottom: 8px;
    }

    .result-desc p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="screen active">
      <h1 class="title">나의 연애 캐릭터 테스트 💕</h1>
      <p class="subtitle">간단한 질문을 통해 나의 연애 성향을 알아보세요!</p>
      <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=500&q=80" alt="연애 테스트" class="main-img">
      <button class="btn" onclick="startQuiz()">테스트 시작하기</button>
      <button class="btn btn-sub" onclick="location.href='index.html'">메인으로 돌아가기</button>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen" class="screen">
      <div class="progress-wrapper">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="q-number" class="q-number">Q1.</div>
      <div id="q-text" class="q-text">질문 영역</div>
      <div id="options-container" class="options-container">
        <!-- 선택지 버튼이 JS로 생성됨 -->
      </div>
    </div>

    <!-- 3. 로딩 화면 -->
    <div id="loading-screen" class="screen">
      <h2 class="loading-text">나의 연애 캐릭터 분석 중... 💕</h2>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="result-screen" class="screen">
      <div class="subtitle">당신의 연애 캐릭터는?</div>
      <h2 id="result-title" class="result-title">결과 타이틀</h2>
      <img id="result-img" src="" alt="결과 이미지" class="main-img">
      <div id="result-desc" class="result-desc">
        <!-- 결과 설명이 JS로 들어감 -->
      </div>
      <button class="btn" onclick="shareResult()">결과 링크 복사하기</button>
      <button class="btn btn-sub" onclick="restartQuiz()">다시 테스트하기</button>
      <button class="btn btn-sub" onclick="location.href='index.html'">메인으로 이동</button>
    </div>
  </div>

  <!-- script.js 연결 필수! -->
  <script src="script.js"></script>
</body>
</html>
