<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테스트잇 - 심리테스트 모음</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif, -apple-system;
    }

    body {
      background-color: #fdf2f4; /* 옅은 핑크 배경 */
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    /* 상단 네비게이션 / 카테고리 */
    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 20px 0;
    }

    .logo {
      font-weight: bold;
      color: #ff6b81;
      font-size: 1.2rem;
    }

    .category-btns {
      display: flex;
      gap: 6px;
    }

    .cat-btn {
      background-color: #d8b4e2;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* 메인 대표 비주얼 배너 */
    .hero-banner {
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .hero-banner img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    /* 검색창 */
    .search-box {
      width: 100%;
      max-width: 450px;
      margin-bottom: 30px;
    }

    .search-input {
      width: 100%;
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid #e0c0d0;
      outline: none;
      text-align: center;
      font-size: 0.85rem;
      background-color: white;
    }

    /* 테스트 목록 그리드 레이아웃 */
    .test-grid {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    /* 테스트 카드 스타일 */
    .test-card {
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .test-card:hover {
      transform: translateY(-4px);
    }

    .card-img-wrapper {
      width: 100%;
      height: 140px;
      background-color: #eee;
      overflow: hidden;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 12px 15px;
    }

    .card-badge {
      display: inline-block;
      font-size: 0.7rem;
      color: #e84118;
      background-color: #fbecec;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #222;
    }
  </style>
</head>
<body>

  <!-- 헤더 영역 -->
  <header>
    <div class="logo">테스트잇 ♥</div>
    <div class="category-btns">
      <button class="cat-btn">성격</button>
      <button class="cat-btn">얼굴</button>
      <button class="cat-btn">그외</button>
      <button class="cat-btn">사주</button>
    </div>
  </header>

  <!-- 메인 대표 이미지 배너 -->
  <div class="hero-banner">
    <!-- 이미지 주소는 원하시는 배너 이미지로 교체하시면 됩니다 -->
    <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1000&q=80" alt="테스트잇 대표 배너">
  </div>

  <!-- 검색창 -->
  <div class="search-box">
    <input type="text" class="search-input" placeholder="찾고 싶은 테스트를 검색하세요 (예: 연애, 성격)">
  </div>

  <!-- 테스트 그리드 목록 -->
  <div class="test-grid">
    
    <!-- 1. 종합평가 테스트 카드 -->
    <a href="test-comprehensive.html" class="test-card">
      <div class="card-img-wrapper">
        <img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=500&q=80" alt="종합 평가 테스트">
      </div>
      <div class="card-content">
        <span class="card-badge">나BTI</span>
        <div class="card-title">나BTI 종합 평가 테스트</div>
      </div>
    </a>

    <!-- 2. 연애 테스트 카드 -->
    <a href="test-love.html" class="test-card">
      <div class="card-img-wrapper">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=500&q=80" alt="연애 테스트">
      </div>
      <div class="card-content">
        <span class="card-badge">연애</span>
        <div class="card-title">사주 떡찰떡 연애 테스트</div>
      </div>
    </a>

    <!-- 3. 자아찾기 모의고사 테스트 카드 -->
    <a href="#" class="test-card">
      <div class="card-img-wrapper">
        <img src="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=500&q=80" alt="자아찾기 테스트">
      </div>
      <div class="card-content">
        <span class="card-badge">모의고사</span>
        <div class="card-title">자아찾기 모의고사 테스트</div>
      </div>
    </a>

  </div>

</body>
</html>
