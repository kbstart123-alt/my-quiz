<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네트워크.gg - IQ & 심리테스트 Lab</title>
  <style>
    :root {
      --primary-color: #6c5ce7;
      --secondary-color: #a29bfe;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #2d3436;
      --text-sub: #636e72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    /* 상단 헤더 */
    header {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
    }

    .brand-logo {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6c5ce7, #00cec9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .nav-tags {
      display: flex;
      gap: 8px;
    }

    .tag-item {
      background-color: #ffffff;
      color: var(--text-sub);
      border: 1px solid #dfe6e9;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-item.active {
      background-color: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    /* 히어로 대표 비주얼 */
    .hero-section {
      width: 100%;
      max-width: 860px;
      background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
      border-radius: 20px;
      padding: 40px 30px;
      color: white;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: 0 10px 25px rgba(108, 92, 231, 0.2);
    }

    .hero-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hero-desc {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* 검색 바 */
    .search-wrapper {
      width: 100%;
      max-width: 500px;
      margin-bottom: 36px;
    }

    .search-input {
      width: 100%;
      padding: 14px 24px;
      border-radius: 30px;
      border: 2px solid #e2e8f0;
      font-size: 0.9rem;
      outline: none;
      background-color: white;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary-color);
    }

    /* 테스트 목록 그리드 */
    .grid-container {
      width: 100%;
      max-width: 860px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .quiz-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #edf2f7;
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .quiz-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.08);
    }

    .thumbnail-box {
      width: 100%;
      height: 150px;
      overflow: hidden;
    }

    .thumbnail-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category-badge {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary-color);
      background-color: #f0edff;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .card-footer {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* 검색 결과 없음 메시지 */
    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <a href="index.html" class="brand-logo">네트워크.gg LAB</a>
    <div class="nav-tags">
      <button class="tag-item active" data-category="전체">전체</button>
      <button class="tag-item" data-category="반려동물">반려동물</button>
      <button class="tag-item" data-category="성격">성격</button>
      <button class="tag-item" data-category="연애">연애</button>
      <button class="tag-item" data-category="사주">사주</button>
    </div>
  </header>

  <!-- 대표 메인 배너 -->
  <div class="hero-section">
    <div class="hero-title">나를 알아가는 심리테스트 🧠</div>
    <div class="hero-desc">간단한 문항을 통해 나의 성격 유형과 심리 상태를 확인해 보세요.</div>
  </div>

  <!-- 검색창 -->
  <div class="search-wrapper">
    <input type="text" id="search-input" class="search-input" placeholder="궁금한 심리테스트를 검색해 보세요...">
  </div>

  <!-- 카드 목록 -->
  <div class="grid-container" id="quiz-grid">
    
    <!-- 1. 강아지 심리테스트 카드 -->
    <a href="dog-test.html" class="quiz-card" data-category="반려동물">
      <div class="thumbnail-box">
        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=500&q=80" alt="강아지 심리 테스트">
      </div>
      <div class="card-body">
        <span class="category-badge">반려동물</span>
        <div class="card-title">나와 어울리는 강아지 성격 테스트 🐶</div>
        <div class="card-footer">⏱️ 소요시간 약 2분</div>
      </div>
    </a>

    <!-- 2. 연애 심리테스트 카드 -->
    <a href="love-test.html" class="quiz-card" data-category="연애">
      <div class="thumbnail-box">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=500&q=80" alt="연애 테스트">
      </div>
      <div class="card-body">
        <span class="category-badge" style="background-color: #ffe0e6; color: #ff6b81;">연애</span>
        <div class="card-title">나의 연애 캐릭터 테스트 💕</div>
        <div class="card-footer">⏱️ 소요시간 약 2분</div>
      </div>
    </a>

    <!-- 3. 사주 오행 테스트 카드 (신규 추가!) -->
    <a href="saju-test.html" class="quiz-card" data-category="사주">
      <div class="thumbnail-box">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=500&q=80" alt="사주 테스트">
      </div>
      <div class="card-body">
        <span class="category-badge" style="background-color: #f3e5f5; color: #8e44ad;">사주</span>
        <div class="card-title">내 안의 사주 오행 성향 테스트 ☯️</div>
        <div class="card-footer">⏱️ 소요시간 약 3분</div>
      </div>
    </a>

    <!-- 검색 결과 없을 때 표시 -->
    <div id="no-result" class="no-result">검색 결과가 없습니다 🔍</div>

  </div>

  <!-- 검색 및 카테고리 필터링 자바스크립트 -->
  <script>
    const searchInput = document.getElementById('search-input');
    const quizCards = document.querySelectorAll('.quiz-card');
    const tagBtns = document.querySelectorAll('.tag-item');
    const noResultMsg = document.getElementById('no-result');

    let currentCategory = '전체';

    function filterCards() {
      const query = searchInput.value.trim().toLowerCase();
      let visibleCount = 0;

      quizCards.forEach(card => {
        const title = card.querySelector('.card-title').innerText.toLowerCase();
        const category = card.getAttribute('data-category');

        const matchesSearch = title.includes(query);
        const matchesCategory = (currentCategory === '전체' || category === currentCategory);

        if (matchesSearch && matchesCategory) {
          card.style.display = 'flex';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      if (visibleCount === 0) {
        noResultMsg.style.display = 'block';
      } else {
        noResultMsg.style.display = 'none';
      }
    }

    searchInput.addEventListener('input', filterCards);

    tagBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tagBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-category');
        filterCards();
      });
    });
  </script>

</body>
</html>
