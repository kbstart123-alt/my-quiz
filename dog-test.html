<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나와 어울리는 강아지 성격 테스트 🐶</title>
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-hover: #5b4bc4;
      --bg: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif, -apple-system;
    }

    body {
      background-color: var(--bg);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 480px;
      width: 100%;
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      text-align: center;
    }

    .thumb-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    p.desc {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* 버튼 스타일 */
    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-bottom: 10px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .option-btn {
      background-color: #f1f3f5;
      color: #333;
      text-align: left;
      font-weight: 500;
      border: 1px solid #e9ecef;
    }

    .option-btn:hover {
      background-color: #e9ecef;
    }

    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
    }

    /* 프로그레스 바 */
    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: #eee;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen">
      <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=500&q=80" class="thumb-img" alt="강아지">
      <h1>나와 어울리는 강아지 성격 테스트 🐶</h1>
      <p class="desc">나의 성격 및 라이프스타일과 딱 맞는 강아지 품종을 찾아보세요!</p>
      <button class="btn" onclick="startTest()">테스트 시작하기</button>
      <a href="index.html" class="back-link">← 메인 화면으로 돌아가기</a>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="quiz-screen" class="hidden">
      <div class="progress-bar">
        <div id="progress" class="progress"></div>
      </div>
      <h1 id="question-text" style="font-size: 1.15rem; margin-bottom: 20px; color: #222;">질문 내용</h1>
      <div id="options-container"></div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="hidden">
      <img id="result-img" class="thumb-img" src="" alt="결과 강아지">
      <h1 id="result-title">결과 타이틀</h1>
      <p id="result-desc" class="desc">결과 설명</p>
      <button class="btn" onclick="restartTest()">다시 테스트하기</button>
      <a href="index.html" class="back-link">← 메인 화면으로 돌아가기</a>
    </div>

  </div>

  <script>
    // 질문 데이터
    const questions = [
      {
        q: "주말에 주로 무엇을 하며 시간을 보내나요?",
        options: [
          { text: "야외로 나아가 산책이나 운동을 즐긴다 🏃‍♂️", type: "active" },
          { text: "집에서 영화를 보며 여유롭게 쉰다 🛋️", type: "quiet" }
        ]
      },
      {
        q: "새로운 사람들과 모임에 참석했을 때 당신의 행동은?",
        options: [
          { text: "먼저 말을 걸고 친해지려고 노력한다 🎉", type: "active" },
          { text: "조용히 분위기를 살피며 어울린다 ☕", type: "quiet" }
        ]
      },
      {
        q: "친구와의 약속이 갑자기 취소되었을 때 당신은?",
        options: [
          { text: "아쉽다! 다른 사람에게 연락해 본다 📱", type: "active" },
          { text: "오예! 혼자만의 시간을 신나게 누린다 🥳", type: "quiet" }
        ]
      }
    ];

    // 결과 데이터
    const results = {
      active: {
        title: "에너지 넘치는 [골든 리트리버] 🦮",
        desc: "당신은 밝고 사교적이며 활력이 넘치는 사람입니다! 누구와도 금방 친해지며 사람들에게 긍정적인 에너지를 전달합니다.",
        img: "https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=500&q=80"
      },
      quiet: {
        title: "차분하고 차분한 [시바견] 🐕",
        desc: "당신은 독립적이고 차분하며 신중한 성격입니다. 혼자만의 시간을 잘 활용하며 깊은 인간관계를 선호합니다.",
        img: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=500&q=80"
      }
    };

    let currentIdx = 0;
    let scores = { active: 0, quiet: 0 };

    function startTest() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      currentIdx = 0;
      scores = { active: 0, quiet: 0 };
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentIdx];
      document.getElementById('question-text').innerText = `Q${currentIdx + 1}. ${q.q}`;
      
      // 진행바 업데이트
      const progressPercent = ((currentIdx) / questions.length) * 100;
      document.getElementById('progress').style.width = `${progressPercent}%`;

      const optionsDiv = document.getElementById('options-container');
      optionsDiv.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        optionsDiv.appendChild(btn);
      });
    }

    function selectOption(type) {
      scores[type]++;
      currentIdx++;

      if (currentIdx < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      const resultType = scores.active >= scores.quiet ? 'active' : 'quiet';
      const res = results[resultType];

      document.getElementById('result-title').innerText = res.title;
      document.getElementById('result-desc').innerText = res.desc;
      document.getElementById('result-img').src = res.img;
    }

    function restartTest() {
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
