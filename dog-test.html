<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나와 어울리는 강아지 성격 테스트 🐶</title>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      max-width: 500px;
      width: 100%;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
    }
    img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #6c5ce7;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }
    .btn-start {
      background-color: #6c5ce7;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=500&q=80" alt="강아지 대표 이미지">
    <h1>나와 어울리는 강아지 성격 테스트 🐶</h1>
    <p>나의 성격과 딱 맞는 강아지 품종은 무엇일까요?</p>
    <button class="btn-start" onclick="alert('테스트를 시작합니다!')">테스트 시작하기</button>
    <br>
    <a href="index.html" class="back-link">← 메인 화면으로 돌아가기</a>
  </div>

</body>
</html>
